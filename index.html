<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Missão IA</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="cabecalho-site">
      <a
        class="marca-site"
        href="https://github.com/guilhermetavaressilva19-eng"
        target="_blank"
        rel="noopener noreferrer"
      >
        Guilherme Tavares
      </a>
      <nav class="menu-site" aria-label="Menu principal">
        <a
          href="https://github.com/guilhermetavaressilva19-eng"
          target="_blank"
          rel="noopener noreferrer"
        >
          GitHub
        </a>
      </nav>
    </header>

    <main class="painel-missao">
      <header class="topo-missao">
        <p class="etiqueta">Missão interativa</p>
        <h1>Decisões sobre Inteligência Artificial</h1>
      </header>

      <div class="trilha-progresso" aria-hidden="true">
        <div class="preenchimento-progresso"></div>
      </div>

      <section class="area-pergunta" aria-live="polite"></section>
      <section class="grade-escolhas"></section>
      <section class="area-acoes"></section>

      <section class="area-final" aria-live="polite">
        <p class="texto-final"></p>
      </section>
    </main>

    <footer class="rodape-site">
      <p>
        Projeto desenvolvido por
        <a
          href="https://github.com/guilhermetavaressilva19-eng"
          target="_blank"
          rel="noopener noreferrer"
        >
          Guilherme Tavares
        </a>
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
